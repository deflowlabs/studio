name: Studio quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SANITY_STUDIO_PROJECT_ID: i34vbeac
      SANITY_STUDIO_DATASET: production
      SANITY_STUDIO_API_VERSION: 2026-08-17
      SANITY_STUDIO_PREVIEW_URL: http://localhost:3000
      SANITY_STUDIO_HOST: http://localhost:3333
      SANITY_STUDIO_ENABLE_VISION: 'false'
      # Validation and migration dry-runs do not write content. Default to the
      # configured production dataset so a separate CI dataset is optional.
      SANITY_VALIDATION_DATASET: ${{ vars.SANITY_VALIDATION_DATASET || 'production' }}
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - id: install
        run: npm ci
      - id: check
        run: npm run check
      - id: build
        run: npm run build
      - name: Validate dataset documents
        id: dataset
        if: ${{ env.SANITY_AUTH_TOKEN != '' }}
        run: npx sanity documents validate --dataset "$SANITY_VALIDATION_DATASET"
      - name: Dry-run additive migration
        id: migration
        if: ${{ env.SANITY_AUTH_TOKEN != '' }}
        run: npx sanity migration run 001-structured-content --dry-run --dataset "$SANITY_VALIDATION_DATASET"
      - id: audit
        run: npm audit --omit=dev --audit-level=high
      - name: Publish Studio summary
        if: always()
        run: |
          {
            echo '## Sanity Studio quality'
            echo
            echo '| Gate | Result |'
            echo '|---|---|'
            echo '| Types, validators and schema extraction | `${{ steps.check.outcome }}` |'
            echo '| Production build | `${{ steps.build.outcome }}` |'
            echo '| Dataset validation | `${{ steps.dataset.outcome || 'skipped' }}` |'
            echo '| Migration dry run | `${{ steps.migration.outcome || 'skipped' }}` |'
            echo '| Production dependency audit | `${{ steps.audit.outcome }}` |'
          } >> "$GITHUB_STEP_SUMMARY"
