name: Dependabot Queue

on: # zizmor: ignore[dangerous-triggers] Privileged follow-up is bot- and same-repository-gated and consumes no PR code or artifacts.
  workflow_run:
    workflows: [Studio Quality]
    types: [completed]

permissions: {}

concurrency:
  group: dependabot-queue-${{ github.event.workflow_run.pull_requests[0].number }}
  cancel-in-progress: false

jobs:
  queue:
    name: Enable reviewed squash auto-merge
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable native squash auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.workflow_run.pull_requests[0].html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
